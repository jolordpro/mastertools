<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tool Name</title>
  <style>
    /* Theme vars are overwritten at runtime by applyTheme() to match AE's panel. */
    :root { --bg:#23272e; --fg:#e8e1d3; --accent:#b08d57; --muted:#9e9484;
            --surface:#2c313a; --border:#3a3f49; --ok:#b08d57; --bad:#8a6a52; --radius:4px; }
    * { box-sizing: border-box; }
    body { margin:0; padding:8px; background:var(--bg); color:var(--fg);
           font:12px -apple-system, "Segoe UI", sans-serif; overflow-y:auto; }
    /* Sticky header — never hidden by any density tier (references/06 §6). */
    .head { position:sticky; top:0; z-index:5; background:var(--bg);
            padding-bottom:6px; display:flex; align-items:center; gap:6px; }
    .head .title { font-weight:600; letter-spacing:.3px; }
    .field { margin-bottom:8px; }
    .field label { display:block; color:var(--muted); margin-bottom:3px; }
    input[type=text] { width:100%; height:28px; padding:0 8px; color:var(--fg);
            background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); }
    .scope { color:var(--muted); margin-bottom:8px; min-height:14px; }
    button.send { width:100%; height:30px; border:1px solid var(--accent);
            background:var(--accent); color:#0b0a09; border-radius:var(--radius); cursor:pointer; font-weight:600; }
    button.send:disabled { background:var(--surface); color:var(--muted); border-color:var(--border); cursor:default; }
    .result { margin-top:8px; min-height:14px; color:var(--muted); transition:color .2s; white-space:pre-wrap; }
    .result.ok  { color:var(--ok); }
    .result.bad { color:var(--bad); }
    .foot { margin-top:10px; color:var(--muted); font-size:10px; }
    /* WIDTH-primary density (set by applyDensity). Tighten, never hide interactive surfaces. */
    body.t-compact { padding:6px; }
    body.t-mini { padding:5px; font-size:11px; }
    body.t-mini .foot { display:none; }
  </style>
</head>
<body class="t-full">
  <div class="head"><span class="title">Tool Name</span><span id="status" class="status"></span></div>

  <div class="field">
    <label for="nameField">Name</label>
    <input type="text" id="nameField" value="Layer" title="Base name — e.g. 'BG' makes BG_01, BG_02 …">
  </div>

  <div id="scope" class="scope"></div>

  <button id="applyBtn" class="send" disabled title="Rename the selected layers in sequence (Enter)">Rename</button>

  <div id="result" class="result"></div>

  <div class="foot">v1.0.0 — yoursite.com</div>

  <script src="./CSInterface.js"></script>
  <script src="./index.js"></script>
</body>
</html>
